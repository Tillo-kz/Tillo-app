<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Tillo цех</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tillo цех">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
  html, body { margin:0; height:100%; background:#111827; overflow:hidden; }
  body { padding-top:env(safe-area-inset-top); box-sizing:border-box; font:16px -apple-system,system-ui,Roboto,sans-serif; }
  iframe { display:block; width:100%; height:100%; border:0; background:#f4f5f7; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:18px; background:#111827; color:#fff; transition:opacity .3s; }
  #splash img { width:96px; height:96px; border-radius:22px; }
  #splash .msg { color:#9ca3af; font-size:15px; text-align:center; padding:0 24px; }
  #splash a { color:#fff; background:#2563eb; padding:12px 20px; border-radius:12px; text-decoration:none; display:none; }
  .hide { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<iframe id="app" title="Tillo цех" allow="clipboard-write"></iframe>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div class="msg" id="msg">Загрузка…</div>
  <a id="open" target="_blank" rel="noopener">Открыть в браузере</a>
</div>
<script>
  // ▼ Ссылка на веб-приложение Apps Script (…/exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyXuOf7hZGlZKt7MvL1Wsw9LS5XfgQDACndNAVL9BUo6Mvgky72402k8EEfUB1BtEZC/exec';

  const app = document.getElementById('app'), splash = document.getElementById('splash'),
        msg = document.getElementById('msg'), open = document.getElementById('open');
  open.href = APP_URL;
  function load() {
    if (!navigator.onLine) { msg.textContent = 'Нет интернета. Приложение откроется, когда связь появится.'; return; }
    msg.textContent = 'Загрузка…';
    app.src = APP_URL;
  }
  app.addEventListener('load', () => { if (app.src) splash.classList.add('hide'); });
  setTimeout(() => {
    if (!splash.classList.contains('hide')) { msg.textContent = 'Долго грузится. Можно открыть напрямую:'; open.style.display = 'inline-block'; }
  }, 20000);
  window.addEventListener('online', () => { if (!app.src) load(); });
  load();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
